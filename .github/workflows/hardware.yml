name: hardware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schematic:
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:10.0.8
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: KiCad global library tables (the container ships none)
        run: |
          mkdir -p "$RUNNER_TEMP/kicad/10.0"
          cp /usr/share/kicad/template/sym-lib-table /usr/share/kicad/template/fp-lib-table "$RUNNER_TEMP/kicad/10.0/"
          echo "KICAD_CONFIG_HOME=$RUNNER_TEMP/kicad" >> "$GITHUB_ENV"
      - name: Pin map against the package data
        run: python3 scripts/check_pinmap.py
      - name: Regenerate the schematic and require no diff
        run: |
          python3 scripts/schgen/build.py
          git diff --exit-code -- hardware/ scripts/schgen/expected.json
      - name: Netlist matches the generator's intent
        run: python3 scripts/schgen/check.py
      - name: ERC
        run: kicad-cli sch erc --severity-all --exit-code-violations -o erc.rpt hardware/e-inverted-pendulum/e-inverted-pendulum.kicad_sch
      - name: Netlist checks
        run: python3 scripts/check_netlist.py
      - name: Symbol/footprint checks
        run: python3 scripts/check_library.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erc-report
          path: erc.rpt

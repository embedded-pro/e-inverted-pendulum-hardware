name: hardware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schematic:
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:10.0.8
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Pin map against the package data
        run: python3 scripts/check_pinmap.py
      - name: Regenerate the schematic and require no diff
        run: |
          python3 kicad/gen/build.py
          git diff --exit-code -- kicad/
      - name: ERC
        run: kicad-cli sch erc --severity-all --exit-code-violations -o erc.rpt kicad/e-inverted-pendulum.kicad_sch
      - name: Netlist checks
        run: python3 scripts/check_netlist.py
      - name: Symbol/footprint checks
        run: python3 scripts/check_library.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erc-report
          path: erc.rpt

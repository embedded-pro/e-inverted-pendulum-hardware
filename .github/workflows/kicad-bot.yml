name: kicad-bot

# CI quality gate for the e-inverted-pendulum hardware design.
# Runs ERC/DRC, BOM availability checks and visual diffs via embedded-pro/kicad-bot.
# https://github.com/embedded-pro/kicad-bot

# Manual runs only for now: kicad-bot v0.1.3 installs KiCad 9.0.8 even with kicad-version "10", and KiCad 9
# can't open this KiCad 10 project ("Failed to load schematic"). hardware.yml runs ERC with KiCad 10.0.8 meanwhile.
# Restore the push and pull_request triggers once kicad-bot installs KiCad 10.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # allow posting the diff/report as a PR comment

jobs:
  kicad-bot:
    name: ERC / DRC / BOM (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # check every board even if one fails (one board today)
      matrix:
        board: [e-inverted-pendulum]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so kicad-bot can compute schematic/PCB diffs against the base.
          fetch-depth: 0

      - name: Run kicad-bot
        uses: embedded-pro/kicad-bot@dbe30bb6e70872d2a0dbf5b006e42442ce434c95 # v0.1.3
        with:
          project-dir: "hardware/${{ matrix.board }}"   # one KiCad project per board
          kicad-version: "10"     # the project is saved by KiCad 10 (action default is 9)
          run-verify: "true"      # ERC + DRC — the only phase implemented in v0.1.3
          run-bom-check: "false"  # BOM/distributor check not available yet (kicad-bot Phase 2)
          run-diff: "false"       # visual schematic/PCB diff not available yet (Phase 3)
          # Reported, not enforced: the board is not routed yet. Flips to "true" once it is.
          fail-on-drc: "false"
          fail-on-erc: "true"     # ERC violations fail the build
          # kicad-bot uploads its own report; keep the artifact name unique per
          # matrix board so parallel jobs don't collide on the same name.
          artifact-name: "kicad-bot-output-${{ matrix.board }}"
